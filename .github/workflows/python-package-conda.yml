# .github/workflows/build.yml
name: Horizon OS Automated Generator, Compiler, and ISO Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_workspace_and_iso:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone the starting repository infrastructure from GitHub
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Set up Python inside the cloud server environment
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step 3: Execute the Python generator script to build the entire code workspace dynamically
    - name: Run Python Project Workspace Generator
      run: |
        echo "🐍 Invoking Python generation script..."
        python3 src/generate_ipad_workspace.py
        echo "📂 Verifying directory layouts..."
        ls -R src/

    # Step 4: Install low-level system compilation tools and ISO creation utilities
    - name: Install System Toolchains and ISO Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm build-essential gcc-multilib g++-multilib xorriso grub-pc-bin Mtools

    # Step 5: Compile the low-level OS kernel components generated by Python
    - name: Compile Horizon Core Kernel
      run: |
        echo "⚡ Compiling Assembly Bootloader..."
        nasm -f elf32 src/boot.asm -o boot.o
        
        echo "⚡ Compiling C Kernel Logic..."
        gcc -m32 -c -ffreestanding -O2 src/kernel.c -o kernel.o
        
        echo "⚡ Linking Objects using memory layout script..."
        ld -m elf_i386 -T src/linker.ld boot.o kernel.o -o horizon.bin

    # Step 6: Compile the application sub-framework architectures
    - name: Compile Horizon Subsystems
      run: |
        echo "⚡ Building C++ Multi-Format Runtime Router..."
        g++ -O2 src/subsystem_manager.cpp -o horizon_subsystem
        
        echo "⚡ Building C++ Horizon App Store Framework..."
        g++ -O2 src/store/store_manager.cpp -o horizon_store

    # Step 7: Create a Proper Bootable ISO Structure
    - name: Package Kernel into Bootable ISO
      run: |
        echo "📁 Creating GRUB directory structure..."
        mkdir -p iso_root/boot/grub
        
        echo "📄 Generating grub.cfg menu..."
        cat << 'EOF' > iso_root/boot/grub/grub.cfg
        menuentry "Horizon OS v1.0" {
            multiboot /boot/horizon.bin
            boot
        }
        EOF
        
        echo "🚚 Moving compiled kernel binary to ISO roots..."
        cp horizon.bin iso_root/boot/horizon.bin
        
        echo "💿 Generating bootable horizon.iso image..."
        grub-mkrescue -o horizon.iso iso_root

    # Step 8: Allocate target disk image footprints (> 8 GB) for application indexing
    - name: Allocate Massive Store Image Footprint
      run: |
        echo "💾 Initializing block file generation (>8 GB space allocation)..."
        dd if=/dev/zero of=horizon_store_data.img bs=1M count=8200
        echo "✅ Block data allocated successfully."

    # Step 9: Package all finished components (including the ISO) into a downloadable distribution folder
    - name: Upload Compiled Horizon OS Distribution
      uses: actions/upload-artifact@v4
      with:
        name: Horizon-OS-Cloud-Distribution
        path: |
          horizon.iso
          horizon_subsystem
          horizon_store
          horizon_store_data.img
